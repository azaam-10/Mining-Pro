
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MINEPRO - V-Protocol Elite</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#020617" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #020617;
        color: #f8fafc;
        overflow-x: hidden;
      }
      .rtl {
        font-family: 'Cairo', sans-serif;
        direction: rtl;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* Advanced Visual FX */
      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(1deg); }
      }
      
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.5; filter: brightness(1); }
        50% { opacity: 1; filter: brightness(1.5); }
      }

      @keyframes scan {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }

      .animate-float {
        animation: float 6s ease-in-out infinite;
      }

      .tier-diamond-fx {
        background: linear-gradient(135deg, rgba(244,63,94,0.1) 0%, rgba(2,6,23,0.8) 100%);
        box-shadow: 0 0 50px rgba(244,63,94,0.25), inset 0 0 20px rgba(255,255,255,0.05);
        border: 1px solid rgba(244,63,94,0.4) !important;
      }

      .tier-platinum-fx {
        background: linear-gradient(135deg, rgba(249,115,22,0.1) 0%, rgba(2,6,23,0.8) 100%);
        box-shadow: 0 0 40px rgba(249,115,22,0.2), inset 0 0 15px rgba(255,255,255,0.05);
        border: 1px solid rgba(249,115,22,0.3) !important;
      }

      .tier-gold-fx {
        background: linear-gradient(135deg, rgba(168,85,247,0.08) 0%, rgba(2,6,23,0.8) 100%);
        box-shadow: 0 0 30px rgba(168,85,247,0.15);
        border: 1px solid rgba(168,85,247,0.25) !important;
      }
      
      .tier-bronze-fx {
        background: linear-gradient(135deg, rgba(59,130,246,0.05) 0%, rgba(2,6,23,0.8) 100%);
        box-shadow: 0 0 20px rgba(59,130,246,0.1);
        border: 1px solid rgba(59,130,246,0.2) !important;
      }

      .shimmer-effect {
        position: relative;
        overflow: hidden;
      }

      .shimmer-effect::after {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 50%; height: 100%;
        background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
        transform: skewX(-25deg);
        animation: scan 4s infinite;
      }

      .neon-text {
        text-shadow: 0 0 10px currentColor;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.48.1"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(reg => {
            console.log('SW registered!', reg);
          }).catch(err => {
            console.log('SW registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
